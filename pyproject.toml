[project]
name = "escarp"
version = "1.4.1"
description = "Identity-aware runtime for parallel coding agents -- persistent browser pool + lease broker over CDP"
authors = [{ name = "David Gao", email = "davidgao1345@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "ai",
    "agents",
    "claude-code",
    "codex",
    "chrome-devtools-protocol",
    "browser-pool",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "aiohttp>=3.9",
    "httpx>=0.28.1",
    "mcp>=1.27.2",
    "pyobjc-framework-applicationservices>=12.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=12.2 ; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.4",
    "playwright>=1.44",
]

[project.urls]
Homepage = "https://github.com/ddavidgao/escarp"
Repository = "https://github.com/ddavidgao/escarp"
Issues = "https://github.com/ddavidgao/escarp/issues"

[project.scripts]
escarp = "escarp.cli:main"
escarp-mcp = "escarp.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/escarp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/escarp/**",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
    "E741",   # single-letter variable names ok (we use `l` for lease iters)
    "SIM117", # nested `with` reads better for async sessions
]

[tool.ruff.lint.per-file-ignores]
"src/escarp/broker/macos.py" = ["F401"]  # pyobjc imports look unused, bridge to Cocoa

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/escarp"]

# pyobjc frameworks ship no type stubs / py.typed marker, so mypy can't analyze
# them. They are only imported on macOS behind sys.platform guards.
[[tool.mypy.overrides]]
module = ["Quartz", "ApplicationServices"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
