name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: install dependencies
        run: uv sync --extra dev

      - name: lint
        run: uv run ruff check src/ tests/

      - name: test
        run: uv run pytest -v
